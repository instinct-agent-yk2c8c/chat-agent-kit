[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-agent-kit"
version = "0.1.0"
description = "Self-hosted starter kit: your own AI agent reachable over iMessage and/or WhatsApp, backed by your own AI provider credentials"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
chat-agent = "chat_agent_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
